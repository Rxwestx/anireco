# fly.toml app configuration file generated for anireco on 2026-08-16T18:59:41+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'anireco'
primary_region = 'nrt'
console_command = 'php /var/www/html/artisan tinker'

[build]
  [build.args]
    NODE_VERSION = '22'
    PHP_VERSION = '8.4'

[env]
  APP_ENV = 'production'
  APP_URL = 'https://anireco.fly.dev'
  APP_LOCALE = 'ja'
  APP_FALLBACK_LOCALE = 'ja'
  APP_FAKER_LOCALE = 'ja_JP'

  LOG_CHANNEL = 'stderr'
  LOG_LEVEL = 'info'
  LOG_STDERR_FORMATTER = 'Monolog\Formatter\JsonFormatter'
  SESSION_DRIVER = 'cookie'
  SESSION_SECURE_COOKIE = 'true'
  DB_CONNECTION = 'pgsql'
  DB_HOST = 'pgsql'
  DB_PORT = '5432'
  DB_DATABASE = 'laravel'
  DB_USERNAME = 'sail'
  DB_PASSWORD = 'password'
  MAIL_MAILER = 'smtp'
  MAIL_SCHEME = 'null'
  MAIL_HOST = 'smtp.gmail.com'
  MAIL_PORT = '587'
  MAIL_FROM_NAME = 'AniReco'
  DEEPL_BASE_URL = 'https://api-free.deepl.com'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
